name: Publish approved npm versions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: magnolia-npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build && npm run check && npm run lint && npm test && npm run test:ssr && npm run test:native && npm run check:packages && npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - run: git push origin --tags
