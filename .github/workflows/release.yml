name: Publish approved npm versions
on:
  workflow_dispatch:
    inputs:
      check_trust:
        description: Check npm trusted publishing without releasing any package
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: magnolia-npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && !inputs.check_trust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build && npm run check && npm run lint && npm test && npm run test:ssr && npm run test:native && npm run check:packages && npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  publish:
    needs: verify
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (inputs.check_trust || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          # The public registry is npm's default. Avoid generating an npmrc
          # with a token entry so npm can negotiate trusted publishing itself.
          package-manager-cache: false
      - name: Check npm trusted publishing
        run: node scripts/check-npm-trust.mjs
        env:
          CHECK_NPM_TRUST_ONLY: ${{ inputs.check_trust }}
      - run: npm install --global npm@11.6.2
        if: ${{ !inputs.check_trust }}
      - run: npm ci
        if: ${{ !inputs.check_trust }}
      # Install with the lockfile's npm version before upgrading the CLI
      # for the registry's trusted publishing exchange.
      - run: npm install --global npm@11.20.0
        if: ${{ !inputs.check_trust }}
      - run: npm run release
        if: ${{ !inputs.check_trust }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - run: git push origin --tags
        if: ${{ !inputs.check_trust }}
