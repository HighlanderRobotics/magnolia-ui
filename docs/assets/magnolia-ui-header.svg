<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="400"
  viewBox="0 0 1600 400"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Magnolia UI</title>
  <desc id="description">
    Purple Magnolia UI lettering over a soft purple aura on black, inspired by
    the Lovat splash.
  </desc>
  <defs>
    <radialGradient id="aura">
      <stop stop-color="#B59AFF" stop-opacity=".4" />
      <stop offset=".84375" stop-color="#B59AFF" stop-opacity=".0354167" />
      <stop offset="1" stop-color="#B59AFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="400" fill="#000" />
  <ellipse cx="800" cy="210" rx="650" ry="205" fill="url(#aura)" />
  <text
    x="800"
    y="244"
    text-anchor="middle"
    fill="#B59AFF"
    font-family="Roboto, Arial, sans-serif"
    font-size="132"
    font-weight="500"
    letter-spacing="-3"
  >
    Magnolia UI
  </text>
</svg>
